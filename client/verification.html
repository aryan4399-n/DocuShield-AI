<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verification result | DocuShieldAI</title><link rel="stylesheet" href="/css/app.css"></head><body class="page-shell"><div id="app-shell"></div><main class="wrap app-main"><div class="app-kicker mono">03 / VERIFICATION SIGNALS</div><div class="result-grid"><section class="result-hero"><div class="eyebrow mono">APPLICATION STATUS</div><div id="result-icon" style="font-size:3.2rem;margin-top:18px;color:var(--cyan)">◌</div><h2 id="result-title">Loading verification...</h2><p id="result-message" class="result-message">Retrieving the persisted result from the verification service.</p><div class="document-results" id="documents"></div></section><aside class="glass-card metric-card"><div class="eyebrow mono">APPLICATION ID</div><div id="application-id" class="metric" style="font-size:1.55rem">—</div><div class="metric-label">Keep this reference for support</div><div style="height:1px;background:var(--line);margin:25px 0"></div><div class="eyebrow mono">PROVIDER SCORE</div><div id="score" class="metric">—</div><div class="metric-label">Only shown when returned by an authorized provider</div><div style="height:1px;background:var(--line);margin:25px 0"></div><div class="eyebrow mono">SUBMITTED</div><div id="date" style="margin-top:14px;color:var(--muted);font-size:13px">—</div></aside></div><div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap"><a href="/" class="btn btn-ghost">Return home</a><a href="admin.html" class="btn btn-primary">Open admin workspace ↗</a></div></main><script src="/js/site.js"></script><script>
const id = new URLSearchParams(location.search).get("applicationId") || localStorage.getItem("verifyflowApplicationId");
const title = document.getElementById("result-title"); const message = document.getElementById("result-message"); const docs = document.getElementById("documents");
function render(result) { const app = result.application; document.getElementById("application-id").textContent = app.applicationId; document.getElementById("score").textContent = app.score == null ? "—" : app.score + "%"; document.getElementById("date").textContent = new Date(app.createdAt).toLocaleString("en-IN", { dateStyle:"medium", timeStyle:"short" }); title.textContent = app.status === "verified" ? "Verification complete" : app.status === "failed" ? "Verification failed" : "Manual review required"; document.getElementById("result-icon").textContent = app.status === "verified" ? "✓" : app.status === "failed" ? "×" : "!"; document.getElementById("result-icon").style.color = app.status === "verified" ? "var(--green)" : app.status === "failed" ? "var(--red)" : "var(--amber)"; message.textContent = app.message; docs.innerHTML = result.documents.map(document => `<div class="doc-result"><div><strong>${DocuShield.escapeHTML(document.title)}</strong><small>${DocuShield.escapeHTML(document.message)}</small></div>${DocuShield.statusPill(document.status)}</div>`).join(""); }
if (!id) { title.textContent = "Application not found"; message.textContent = "Start a new verification to create an application reference."; } else { fetch("/api/applications/" + encodeURIComponent(id)).then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data.message); return data; }).then(render).catch(error => { title.textContent = "Unable to load result"; message.textContent = error.message; }); }
</script></body></html>
