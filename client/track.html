<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track application | DocuShieldAI</title><link rel="stylesheet" href="/css/app.css"></head><body class="page-shell"><div id="app-shell"></div><main class="wrap app-main"><div class="app-kicker mono">APPLICATION TRACKING</div><h1 class="app-title">Know where<br>trust stands.</h1><p class="app-subtitle">Enter an application reference to view its public processing timeline. Private document contents remain protected.</p><form id="track-form" class="glass-card form-card" style="margin-top:32px"><div class="field"><label for="application-id">Application ID</label><input id="application-id" required placeholder="VF-2026-000001" autocomplete="off"></div><div id="track-error" class="error-note"></div><div class="form-actions"><button class="btn btn-primary">Track application ↗</button></div></form><section id="timeline" class="glass-card" hidden style="margin-top:20px"><div class="eyebrow mono">PROCESSING TIMELINE</div><h2 id="track-title" style="font-size:1.8rem;margin:16px 0">—</h2><p id="track-message" class="muted"></p><div id="track-status" style="display:grid;gap:12px;margin-top:24px"></div></section></main><script src="/js/api.js"></script><script src="/js/site.js"></script><script>const form=document.getElementById('track-form');document.getElementById('app-shell').innerHTML=DocuShield.appShell();form.addEventListener('submit',async event=>{event.preventDefault();const id=document.getElementById('application-id').value.trim();const error=document.getElementById('track-error');error.textContent='';try{const data=await DocuShieldAPI.getApplication(id);const app=data.application;document.getElementById('timeline').hidden=false;document.getElementById('track-title').textContent=app.applicationId+' · '+DocuShield.statusLabel(app.status);document.getElementById('track-message').textContent=app.message;const stages=['Application created','Documents uploaded','OCR and analysis','Risk assessment','Final review'];const completed=app.status==='verified'||app.status==='failed'?4:3;document.getElementById('track-status').innerHTML=stages.map((stage,index)=>`<div class="doc-result"><span>${index<=completed?'✓':'○'} &nbsp; ${stage}</span><span class="mono muted">${index<=completed?'COMPLETE':'PENDING'}</span></div>`).join('');}catch(err){error.textContent=err.message;}});</script></body></html>
